plugins { id 'java'; id 'application' }
repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
dependencies {
 implementation 'org.apache.spark:spark-sql_2.12:3.5.8'
 testImplementation platform('org.junit:junit-bom:5.11.4')
 testImplementation 'org.junit.jupiter:junit-jupiter'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
def sparkJvm = ['-Dio.netty.tryReflectionSetAccessible=true', '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED', '--add-opens=java.base/java.nio=ALL-UNNAMED', '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED', '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.io=ALL-UNNAMED', '--add-opens=java.base/sun.security.action=ALL-UNNAMED']
application { mainClass = 'ru.pdbp.DemoApp'; applicationDefaultJvmArgs = sparkJvm }
test { useJUnitPlatform(); jvmArgs sparkJvm; maxHeapSize = '2g'; environment 'SPARK_LOCAL_IP', '127.0.0.1' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(JavaExec).configureEach { environment 'SPARK_LOCAL_IP', '127.0.0.1'; maxHeapSize = '2g' }
